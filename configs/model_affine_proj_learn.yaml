# Affine+Proj（hard，可学习 W0 ∈ [-15, 9] dB），CLAUDE.md 6.3 节：先固定 W0 = 0 dB 训练 20 个 epoch，再解冻。
# 每帧输出 W0(t, f)，经因果递归平均（时间常数 w0_tau_s）后使用（用户 2026-10-31 决定，替代整句平均）
name: affine_proj_hard_learn
kind: affine
proj: hard
w0_db: learn
w0_freeze_epochs: 20
w0_init_db: 0.0
w0_tau_s: 0.5
width: 32
hidden: 32
intra_bidirectional: true
out_init_scale: 0.01       # 输出层权重乘以 0.01、偏置置 0（6.1 节）
seed_key: beamfusion       # 与 BeamFusion 基线相同的训练种子（初始化 RNG 状态与数据顺序相同）
train:
  seed: 1234
  epochs: 50
  batch_size: 30
  micro_batch: null         # 梯度累积子批大小（null = 不累积）；显存不足时设置，例如 CPU 用 5、T4 用 10–15
  lr: 1.0e-3
  lr_factor: 0.5
  lr_patience: 5           # 验证损失连续 5 个 epoch 不下降时学习率减半
  min_lr: 1.0e-4
  grad_clip: null
  amp: false               # GPU 混合精度（float16）；默认关闭，速度对比见阶段 3 报告
  log_every: 50
