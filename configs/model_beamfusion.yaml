# BeamFusion（凸组合）复现，CLAUDE.md 5.1 节 / BeamFusion 论文 4.3 节
name: beamfusion
kind: beamfusion
width: 32                  # encoder 输出 / decoder 输入维度
hidden: 32                 # G-DPRNN 隐层维度
intra_bidirectional: true  # GTCRN 默认（沿频率双向，时间上仍因果）；参数量 85,054，与论文 85k 一致
train:
  seed: 1234
  epochs: 50
  batch_size: 30
  micro_batch: null         # 梯度累积子批大小（null = 不累积）；显存不足时设置，例如 CPU 用 5、T4 用 10–15
  lr: 1.0e-3
  lr_factor: 0.5
  lr_patience: 5           # 验证损失连续 5 个 epoch 不下降时学习率减半
  min_lr: 1.0e-4
  grad_clip: null
  amp: false               # GPU 混合精度（float16）；默认关闭，速度对比见阶段 3 报告
  log_every: 50
