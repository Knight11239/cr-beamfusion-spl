# Affine+Proj（仿射融合 + WNG 投影，hard，W0 = 0 dB），CLAUDE.md 6.1–6.2 节。训练设置与 BeamFusion 完全相同
name: affine_proj_hard_0db
kind: affine
proj: hard                 # none | hard | smooth
w0_db: 0.0                 # W0（dB），须 < 10 log10(M) ≈ 9.03 dB
width: 32
hidden: 32
intra_bidirectional: true
out_init_scale: 0.01       # 输出层权重乘以 0.01、偏置置 0（6.1 节）
seed_key: beamfusion       # 与 BeamFusion 基线相同的训练种子（初始化 RNG 状态与数据顺序相同）
train:
  seed: 1234
  epochs: 50
  batch_size: 30
  micro_batch: null         # 梯度累积子批大小（null = 不累积）；显存不足时设置，例如 CPU 用 5、T4 用 10–15
  lr: 1.0e-3
  lr_factor: 0.5
  lr_patience: 5           # 验证损失连续 5 个 epoch 不下降时学习率减半
  min_lr: 1.0e-4
  grad_clip: null
  amp: false               # GPU 混合精度（float16）；默认关闭，速度对比见阶段 3 报告
  log_every: 50
